name: KOPIS diag (temporary)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: Probe KOPIS
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
        run: |
          python - <<'EOF'
          import os, datetime as dt, requests
          key = os.environ["KOPIS_API_KEY"].strip()
          t = dt.date.today(); f = lambda d: d.strftime("%Y%m%d")
          s, e = f(t - dt.timedelta(days=7)), f(t + dt.timedelta(days=365))
          base = "http://www.kopis.or.kr/openApi/restful/prffest"
          for rows in (100, 50, 10):
            for ua in ("default", "browser"):
              h = {"User-Agent": "Mozilla/5.0"} if ua == "browser" else {}
              p = {"stdate": s, "eddate": e, "shcate": "CCCD", "cpage": 1, "rows": rows, "service": key}
              r = requests.get(base, params=p, headers=h, timeout=15)
              n = r.text.count("<db>")
              print(f"=== rows={rows} ua={ua} -> {r.status_code} items={n} | {r.text[:200].replace(key,'***')}")
          EOF
